name: Clean Machine Local Upgrades Core Candidate

on:
  pull_request:
    paths:
      - "src/aiverse_distribution/catalog/**"
      - "src/aiverse_distribution/dependency_locks/**"
      - "src/aiverse_distribution/candidate_admission.py"
      - "src/aiverse_distribution/release_catalog.py"
      - "qualification/core-local-upgrades-candidate-2026-10-19/**"
      - "tests/acceptance/**"
      - ".github/workflows/clean-machine-local-upgrades-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      AI_VERSE_ACCEPTANCE_RELEASE_SET: core-local-upgrades-candidate-2026-10-19
      AI_VERSE_ACCEPTANCE_EXPECTED_REFS: '{"ai-verse-os":"d1fecc8026445f96212a4f65a9932f5e7a301bf8","ai-verse-brain":"f746806e4361c2b1cd67ee97810071cc86db7b9a","ai-verse-memory":"f1327be48ba2ee0043959021365e6dbb9dcb1d3a","ai-verse-skills":"afde5c06307fba7d074de2929c2eb6c3dc6bdab8","ai-verse-data":"f8978f8f7a1bc94edecddc2662112233289159a3"}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - name: Pin tested npm major
        run: npm install --global npm@10.9.2

      - name: Preserve exact source bytes on Windows checkouts
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Verify runtimes
        run: |
          python --version
          node --version
          npm --version

      - name: Install Distribution candidate
        run: python -m pip install .

      - name: Verify immutable candidate admission
        run: python scripts/validate-candidate-admission.py

      - name: Prove exact Core candidate from a clean machine
        run: python tests/acceptance/profile_acceptance.py core

      - name: Prove admitted optional package lifecycle and member-state preservation
        run: python tests/acceptance/optional_package_candidate_acceptance.py
