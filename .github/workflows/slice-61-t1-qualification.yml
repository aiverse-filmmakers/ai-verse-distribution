name: Slice 6.1 T1 Exact Network Qualification

on:
  push:
    branches: [slice-6.1-t1-governance-harness]
    paths:
      - "scripts/run-repository-network-governance-regression.py"
      - "tests/test_repository_network_governance_regression.py"
      - ".github/workflows/slice-61-t1-qualification.yml"

permissions:
  contents: write

jobs:
  exact-network:
    runs-on: ubuntu-latest
    env:
      QUAL: ${{ github.workspace }}
    steps:
      - name: Checkout Distribution T1 branch
        uses: actions/checkout@v4
        with:
          path: Distribution
          fetch-depth: 0

      - name: Correct projection contract and fixture
        working-directory: Distribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/run-repository-network-governance-regression.py')
          text = script.read_text(encoding='utf-8')
          old = (
              '    _require(promotion_release == release_set, "promotion ledger and release-set bytes describe different release truth")\n'
          )
          new = (
              '    _require(\n'
              '        promotion_release.get("id") == release_set.get("id")\n'
              '        and promotion_release.get("profile") == release_set.get("profile")\n'
              '        and promotion_release.get("status") == release_set.get("status"),\n'
              '        "promotion ledger release identity/profile/status differs from the standalone release set",\n'
              '    )\n'
              '    _require(\n'
              '        promotion_release.get("components") == release_set.get("components"),\n'
              '        "promotion ledger component projection differs from the standalone release pins",\n'
              '    )\n'
          )
          if text.count(old) != 1:
              raise SystemExit('expected promotion equality assertion not found exactly once')
          script.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_repository_network_governance_regression.py')
          text = tests.read_text(encoding='utf-8')
          old = '            "release_sets": [self.release],\n'
          new = '            "release_sets": [{key: value for key, value in self.release.items() if key != "schema_version"}],\n'
          if text.count(old) != 1:
              raise SystemExit('expected initial promotion fixture not found exactly once')
          text = text.replace(old, new)
          old = '        self.promotions["release_sets"] = [self.release]\n'
          new = (
              '        self.promotions["release_sets"] = [\n'
              '            {key: value for key, value in self.release.items() if key != "schema_version"}\n'
              '        ]\n'
          )
          if text.count(old) != 1:
              raise SystemExit('expected rewrite promotion fixture not found exactly once')
          tests.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add scripts/run-repository-network-governance-regression.py tests/test_repository_network_governance_regression.py
          git commit -m "Align T1 harness with promotion projection authority"

      - name: Checkout exact canonical System planning boundary
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-System
          ref: b917f8812f21a02f4b58e402ce6dc5838303bb5d
          path: System

      - name: Checkout exact State-observed OS owner head
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-OS
          ref: 83747a90998077ad2ab4636f202ca2e065a9a6bb
          path: OS

      - name: Checkout exact State-observed Brain owner head
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-Brain
          ref: 4406d15068284b88e0076b6dfff5aa0b06890a24
          path: Brain

      - name: Checkout exact State-observed Memory owner head
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-Memory
          ref: 09911eae0b4b0cbf7e7e7969230fe5b86647b841
          path: Memory

      - name: Checkout exact State-observed Skills owner head
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-Skills
          ref: 23779f10515951ac92c83cba34a1a868c02c4d87
          path: Skills

      - name: Checkout exact State-observed Data owner head
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-Data
          ref: 7e9fadbd73752b24eb79e270aff6b311ad508109
          path: Data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Distribution
        working-directory: Distribution
        run: python -m pip install .

      - name: Focused T1 harness tests
        working-directory: Distribution
        run: python -m unittest discover -s tests -p "test_repository_network_governance_regression.py" -v

      - name: Exact read-only network regression
        working-directory: Distribution
        run: |
          python scripts/run-repository-network-governance-regression.py \
            --distribution-root "$QUAL/Distribution" \
            --system-root "$QUAL/System" \
            --os-root "$QUAL/OS" \
            --brain-root "$QUAL/Brain" \
            --memory-root "$QUAL/Memory" \
            --skills-root "$QUAL/Skills" \
            --data-root "$QUAL/Data"

      - name: Assert tracked evidence remains unchanged
        shell: bash
        run: |
          for repo in Distribution System OS Brain Memory Skills Data; do
            test -z "$(git -C "$QUAL/$repo" status --porcelain --untracked-files=no)"
          done

      - name: Remove temporary qualifier and publish qualified T1 tree
        working-directory: Distribution
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/slice-61-t1-qualification.yml
          git commit -m "Remove Slice 6.1 T1 qualification workflow"
          git push origin HEAD:slice-6.1-t1-governance-harness
