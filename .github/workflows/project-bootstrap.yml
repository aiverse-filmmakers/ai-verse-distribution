name: Project bootstrap qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/aiverse_distribution/**'
      - 'scripts/**'
      - 'tests/test_project*.py'
      - 'tests/test_bootstrap_scripts.py'
      - 'tests/acceptance/project_bootstrap_acceptance.py'
      - '.github/workflows/project-bootstrap.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap unit checks
        run: python -m unittest discover -s tests -p 'test_project*.py'
      - name: First-stage pin consistency
        run: python -m unittest discover -s tests -p 'test_bootstrap_scripts.py'
      - name: No-existing-Python entry on Unix
        if: runner.os != 'Windows'
        env:
          AIVERSE_BOOTSTRAP_NO_SYSTEM_PYTHON: '1'
        run: sh scripts/bootstrap.sh --help
      - name: No-existing-Python entry on Windows
        if: runner.os == 'Windows'
        env:
          AIVERSE_BOOTSTRAP_NO_SYSTEM_PYTHON: '1'
        shell: pwsh
        run: ./scripts/bootstrap.ps1 --help
      - name: Historical Core installation mechanics
        run: python tests/acceptance/project_bootstrap_acceptance.py --source . --output bootstrap-report.json
      - name: Exact repaired Core fixture qualification
        run: python tests/acceptance/project_bootstrap_acceptance.py --source . --candidate qualification/repaired-core/candidate.json --output repaired-bootstrap-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-${{ runner.os }}
          path: |
            bootstrap-report.json
            repaired-bootstrap-report.json
