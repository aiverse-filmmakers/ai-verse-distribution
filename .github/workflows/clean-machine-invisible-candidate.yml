name: Clean Machine Invisible Intelligence Candidate

on:
  pull_request:
    paths:
      - "src/aiverse_distribution/catalog/**"
      - "src/aiverse_distribution/dependency_locks/**"
      - "src/aiverse_distribution/release_catalog.py"
      - "src/aiverse_distribution/orchestrator.py"
      - "tests/acceptance/**"
      - ".github/workflows/clean-machine-invisible-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      AI_VERSE_ACCEPTANCE_RELEASE_SET: agent-invisible-intelligence-rc1-2026-09-14
      AI_VERSE_ACCEPTANCE_EXPECTED_REFS: '{"ai-verse-os":"156f15f162c6d63159b54d3ad87e0342ec7cf9aa","ai-verse-brain":"16c0b7ea32fcb4759cfb8368876b6985016eab68","ai-verse-memory":"1c6acf036d42937e57d94dfe48ac501727861653","ai-verse-skills":"71264af6b2b9a575812fe18858d75a54ea2ff545","ai-verse-data":"8edde7dca5afa34e300130cc6b8ee2b4170ad40f","ai-verse-gateway":"7627df658b2071ecb4ea242572343edfb7abf768","ai-verse-automations":"caaed83b98026dd955640fc015d181529b91a1c6","ai-verse-multiple-bots":"c600e2bc014351a61e1c0e2673fc63f5d5fa54ec","ai-verse-token":"23b7b8ecbc9d9ef267f5e10449f785eb11107dd4"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin tested npm major
        run: npm install --global npm@10.9.2
      - name: Verify runtimes
        run: |
          python --version
          node --version
          npm --version
      - name: Install Distribution candidate
        run: python -m pip install .
      - name: Prove exact Invisible Intelligence candidate from a clean machine
        run: python tests/acceptance/agent_acceptance.py
