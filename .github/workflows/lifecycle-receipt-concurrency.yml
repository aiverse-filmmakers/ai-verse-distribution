name: Lifecycle Receipt Concurrency

on:
  pull_request:
  push:
    paths:
      - "src/aiverse_distribution/state.py"
      - "src/aiverse_distribution/orchestrator.py"
      - "src/aiverse_distribution/cli.py"
      - "tests/test_lifecycle_receipt_concurrency.py"
      - ".github/workflows/lifecycle-receipt-concurrency.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Distribution
        run: python -m pip install .
      - name: WSA-2026-034 lifecycle receipt regressions
        run: python -m unittest discover -s tests -p "test_lifecycle_receipt_concurrency.py" -v
