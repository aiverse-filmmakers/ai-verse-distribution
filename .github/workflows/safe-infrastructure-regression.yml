name: Safe Infrastructure Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: safe-infrastructure-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composed-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      AIVERSE_OS_ROOT: ${{ github.workspace }}/.qualification/AI-Verse-OS
      AIVERSE_SKILLS_ROOT: ${{ github.workspace }}/.qualification/AI-Verse-Skills
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@v4

      - name: Checkout frozen OS owner
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-OS
          ref: 470ad89e6b96d898161dee36d4e4fa8064dd6a8d
          path: .qualification/AI-Verse-OS

      - name: Checkout frozen Skills owner
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-Skills
          ref: d4a02888ba8d83c4a15ce1b538ffdafaaf83bee1
          path: .qualification/AI-Verse-Skills

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Distribution
        run: python -m pip install .

      - name: Cross-repo owner boundary assertions
        run: python -m unittest discover -s tests -p "test_safe_infrastructure_cross_repo.py" -v

      - name: Distribution infrastructure gating and apply regression
        run: python -m unittest discover -s tests -p "test_infrastructure_*.py" -v

      - name: Distribution recovery and restore regression
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_lkg_recovery.py" -v
          python -m unittest discover -s tests -p "test_recovery_orchestrator.py" -v
          python -m unittest discover -s tests -p "test_restore_cli.py" -v

      - name: Distribution member UX and update regression
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_experience_*.py" -v
          python -m unittest discover -s tests -p "test_update_*.py" -v
          python -m unittest discover -s tests -p "test_adapters.py" -v
          python -m unittest discover -s tests -p "test_safe_infrastructure_transition_contract.py" -v

      - name: OS Workspace infrastructure owner contract
        working-directory: .qualification/AI-Verse-OS
        run: node scripts/test-workspace-infrastructure.mjs

      - name: OS capability placement and promotion owner contracts
        working-directory: .qualification/AI-Verse-OS
        shell: bash
        run: |
          node scripts/test-capability-placement.mjs
          node scripts/test-capability-promotion.mjs
          node scripts/test-capability-resolver-core.mjs
          node scripts/test-adapter-sync.mjs

      - name: Skills registry and managed-generation tests
        working-directory: .qualification/AI-Verse-Skills
        shell: bash
        run: |
          python scripts/validate_registry.py
          python -m unittest discover -s tests -v
          python installer/aiverse_skills.py list
          python installer/aiverse_skills.py install --profile full --dry-run
