name: WSA-2026-036 Final Error Redaction

on:
  pull_request:
    paths:
      - "src/aiverse_distribution/process.py"
      - "src/aiverse_distribution/redaction.py"
      - "src/aiverse_distribution/cli.py"
      - "src/aiverse_distribution/orchestrator.py"
      - "tests/test_process.py"
      - "tests/test_cli.py"
      - "tests/test_orchestrator.py"
      - "tests/test_diagnostics.py"
      - ".github/workflows/wsa-2026-036-error-redaction.yml"
  push:
    branches: [main]
    paths:
      - "src/aiverse_distribution/process.py"
      - "src/aiverse_distribution/redaction.py"
      - "src/aiverse_distribution/cli.py"
      - "src/aiverse_distribution/orchestrator.py"
      - "tests/test_process.py"
      - "tests/test_cli.py"
      - "tests/test_orchestrator.py"
      - "tests/test_diagnostics.py"
      - ".github/workflows/wsa-2026-036-error-redaction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  error-redaction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile redaction boundary
        run: |
          python -m py_compile src/aiverse_distribution/process.py
          python -m py_compile src/aiverse_distribution/redaction.py
          python -m py_compile src/aiverse_distribution/cli.py
          python -m py_compile src/aiverse_distribution/orchestrator.py
      - name: Run WSA-036 redaction regressions
        run: |
          python -m unittest discover -s tests -p "test_process.py" -v
          python -m unittest discover -s tests -p "test_cli.py" -v
          python -m unittest discover -s tests -p "test_orchestrator.py" -v
          python -m unittest discover -s tests -p "test_diagnostics.py" -v
