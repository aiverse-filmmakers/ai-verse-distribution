name: Purpose Context Slice 12.3 Exact Qualification

on:
  pull_request:
    paths:
      - 'qualification/purpose-context/**'
      - '.github/workflows/purpose-context-slice-12-3-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purpose-context-slice-12-3-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-composed-core-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Pin tested npm major
        run: npm install --global npm@10.9.2
      - name: Prove composed Core acceptance against the exact frozen Purpose candidate
        shell: bash
        run: bash qualification/purpose-context/test-composed-core-candidate.sh
