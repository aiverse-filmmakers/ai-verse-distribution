name: Purpose Context Slice 12.3 Exact Qualification

on:
  pull_request:
    paths:
      - 'qualification/purpose-context/**'
      - '.github/workflows/purpose-context-slice-12-3-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purpose-context-slice-12-3-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-clean-restart-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Prove clean restart/rebuild against exact frozen OS ref
        shell: bash
        run: bash qualification/purpose-context/test-clean-restart-rebuild.sh
