name: Purpose Context Slice 12.3 Exact Qualification

on:
  pull_request:
    paths:
      - 'qualification/purpose-context/**'
      - '.github/workflows/purpose-context-slice-12-3-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purpose-context-slice-12-3-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-context-ladder-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Prove Context Ladder/runtime integration against exact candidate refs
        shell: bash
        run: bash qualification/purpose-context/test-context-ladder-runtime.sh
