name: Propagation Slice 5.2 T2 Apply Corrected

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/propagation-52-t2-apply-v4.yml

permissions:
  contents: write

jobs:
  apply-t2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply corrected T2 wiring
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/propagation-52-t2-apply-v2.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply T2 wiring\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Install Distribution\n'
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('cannot recover T2 patch script')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          ) + '\n'
          script = script.replace(
              'from pathlib import Path\n',
              'from pathlib import Path\nimport textwrap\n',
              1,
          )
          broken_test = 'Path("tests/test_lifecycle_payload_wiring.py").write_text(tests.replace("          ", ""), encoding="utf-8")'
          fixed_test = 'Path("tests/test_lifecycle_payload_wiring.py").write_text(textwrap.dedent(tests), encoding="utf-8")'
          if script.count(broken_test) != 1:
              raise SystemExit('expected malformed test-generation expression')
          script = script.replace(broken_test, fixed_test, 1)
          exec(compile(script, '<slice-5.2-t2-patch>', 'exec'), {'__name__': '__main__'})

          # The v2 helper used indentation-stripping string surgery for this one call.
          # Normalize only that generated block to the live method's native indentation.
          core = Path('src/aiverse_distribution/core_update.py')
          text = core.read_text(encoding='utf-8')
          start = text.index('generated_plan = plan_generated_refresh(')
          line_start = text.rfind('\n', 0, start) + 1
          end = text.index('            if generated_plan:', start)
          block = '''            generated_plan = plan_generated_refresh(
              target_raw=target.raw,
              project_root=root,
              distribution_home=self.state.home,
              lifecycle=(
                  LifecycleVerb.ROLLBACK
                  if transition_kind == "rollback"
                  else LifecycleVerb.UPDATE
              ),
          )
'''
          block = textwrap.dedent(block)
          block = textwrap.indent(block, '            ')
          core.write_text(text[:line_start] + block + text[end:], encoding='utf-8')

      - name: Compile changed Python
        run: python -m py_compile src/aiverse_distribution/core_update.py src/aiverse_distribution/generated_refresh.py src/aiverse_distribution/project_install.py tests/test_lifecycle_payload_wiring.py
      - name: Install Distribution
        run: python -m pip install .
      - name: Run focused T2 wiring tests
        run: python -m unittest tests.test_lifecycle_payload_wiring tests.test_project_install tests.test_generated_refresh -v
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify T2-only diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' docs/MEMBER-PAYLOAD-GUARD.md src/aiverse_distribution/core_update.py src/aiverse_distribution/generated_refresh.py src/aiverse_distribution/project_install.py tests/test_lifecycle_payload_wiring.py | sort)"
          ! grep -q "require_mutation_permitted" src/aiverse_distribution/generated_refresh.py
          grep -q "build_structured_payload_evidence" src/aiverse_distribution/project_install.py
          grep -q "LifecycleVerb.ROLLBACK" src/aiverse_distribution/core_update.py
      - name: Commit Slice 5.2 T2 wiring
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/MEMBER-PAYLOAD-GUARD.md src/aiverse_distribution/core_update.py src/aiverse_distribution/generated_refresh.py src/aiverse_distribution/project_install.py tests/test_lifecycle_payload_wiring.py
          git commit -m "Wire lifecycle member payload guard"
          git push origin HEAD:main
