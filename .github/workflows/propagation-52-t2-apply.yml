name: Propagation Slice 5.2 T2 Apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/propagation-52-t2-apply.yml

permissions:
  contents: write

jobs:
  apply-t2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wire lifecycle payload guard
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_text, old, new):
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one patch marker in {path_text}, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # project_install.py: bootstrap-owned files and the exact shared-registry slice.
          replace_once(
              "src/aiverse_distribution/project_install.py",
              "from .process import run\nfrom .project_bootstrap import _write_json, claim, prepare_tools\nfrom .project_layout import ProjectLayout\nfrom .release_catalog import Catalog, DistributionError\n",
              "from .lifecycle_payload import (\n    LifecycleVerb,\n    build_project_file_evidence,\n    build_structured_payload_evidence,\n    require_payload_mutation,\n)\nfrom .process import run\nfrom .project_bootstrap import _write_json, claim, prepare_tools\nfrom .project_layout import ProjectLayout\nfrom .release_catalog import Catalog, DistributionError\nfrom .update_safety import MutationOperation, MutationRoute, OwnershipClass\n",
          )

          old_write_owned = '''def _write_owned(layout: ProjectLayout, path: Path, text: str, receipt: dict) -> None:
              """Replace only unchanged files previously recorded as bootstrap-owned."""
              key = str(path)
              files = receipt.setdefault("owned_files", {})
              pending_digest = receipt.setdefault("pending_files", {}).get(key)
              if path.is_symlink():
                  raise DistributionError(f"Bootstrap file must not be a symlink: {path}")
              if path.exists():
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if files.get(key) != actual and pending_digest != actual:
                      raise DistributionError(f"Preserving an existing or locally edited file: {path}")
              path.parent.mkdir(parents=True, exist_ok=True)
              # Record pending bytes before the replace; an interrupted write remains
              # identifiable as ours rather than becoming unclaimed member content.
              digest = hashlib.sha256(text.encode("utf-8")).hexdigest()
              receipt["pending_files"][key] = digest
              _write_json(layout.receipt, receipt)
              pending = path.with_name(path.name + ".bootstrap-pending")
              if pending.is_symlink():
                  raise DistributionError(f"Preserving an existing pending file: {pending}")
              if pending.exists():
                  if pending_digest != digest or hashlib.sha256(pending.read_bytes()).hexdigest() != digest:
                      raise DistributionError(f"Preserving an existing pending file: {pending}")
              else:
                  with pending.open("x", encoding="utf-8", newline="\\n") as handle:
                      handle.write(text)
                      handle.flush()
                      os.fsync(handle.fileno())
              os.replace(pending, path)
              files[key] = digest
              receipt["pending_files"].pop(key)
              _write_json(layout.receipt, receipt)
          '''.replace("          ", "")

          new_write_owned = '''def _write_owned(layout: ProjectLayout, path: Path, text: str, receipt: dict) -> None:
              """Publish only receipt-bound bootstrap bytes through the shared payload guard."""
              key = str(path)
              files = receipt.setdefault("owned_files", {})
              pending_files = receipt.setdefault("pending_files", {})
              pending_digest = pending_files.get(key)
              if path.is_symlink():
                  raise DistributionError(f"Bootstrap file must not be a symlink: {path}")
              existed = path.exists()
              if existed:
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if files.get(key) != actual and pending_digest != actual:
                      raise DistributionError(f"Preserving an existing or locally edited file: {path}")
              path.parent.mkdir(parents=True, exist_ok=True)
              digest = hashlib.sha256(text.encode("utf-8")).hexdigest()
              operation = MutationOperation.REPLACE if existed else MutationOperation.CREATE

              # CREATE proof intentionally uses the existing pending ledger. Claim the
              # exact planned digest before publication, then let the reusable guard
              # prove containment/provenance. REPLACE is checked against the current
              # owned/pending receipt before the pending digest is advanced.
              if operation is MutationOperation.CREATE:
                  pending_files[key] = digest
                  _write_json(layout.receipt, receipt)
              evidence = build_project_file_evidence(
                  layout,
                  path,
                  lifecycle=LifecycleVerb.INSTALL,
                  operation=operation,
                  lifecycle_admitted=True,
                  owner_authorized=True,
                  planned_sha256=digest if operation is MutationOperation.CREATE else None,
                  receipt=receipt,
              )
              require_payload_mutation(evidence)
              if operation is MutationOperation.REPLACE:
                  pending_files[key] = digest
                  _write_json(layout.receipt, receipt)

              pending = path.with_name(path.name + ".bootstrap-pending")
              if pending.is_symlink():
                  raise DistributionError(f"Preserving an existing pending file: {pending}")
              if pending.exists():
                  if pending_digest != digest or hashlib.sha256(pending.read_bytes()).hexdigest() != digest:
                      raise DistributionError(f"Preserving an existing pending file: {pending}")
              else:
                  with pending.open("x", encoding="utf-8", newline="\\n") as handle:
                      handle.write(text)
                      handle.flush()
                      os.fsync(handle.fileno())
              os.replace(pending, path)
              files[key] = digest
              pending_files.pop(key)
              _write_json(layout.receipt, receipt)


          def _register_bootstrap_extension(
              layout: ProjectLayout,
              registry_path: Path,
              instructions: Path,
              receipt: dict,
          ) -> dict:
              """Change only Distribution's exact entry in the shared OS extension registry."""
              if registry_path.is_symlink() or not registry_path.is_file():
                  raise DistributionError("Cannot register bootstrap instructions in an unavailable extension registry")
              try:
                  registry_path.resolve().relative_to(layout.project.resolve())
              except ValueError as exc:
                  raise DistributionError("Extension registry escaped the admitted project root") from exc
              try:
                  registry = json.loads(registry_path.read_text(encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  raise DistributionError("Cannot register bootstrap instructions in an invalid OS extension registry") from exc
              if registry.get("schema_version") != "1.0" or not isinstance(registry.get("extensions"), dict):
                  raise DistributionError("Cannot register bootstrap instructions in an unknown OS extension registry")

              key = "ai-verse-project-bootstrap"
              source = "ai-verse-distribution/project-bootstrap-v1"
              existing = registry["extensions"].get(key)
              if existing is not None and not isinstance(existing, dict):
                  raise DistributionError("Preserving an invalid existing bootstrap extension entry")
              if existing and existing.get("source") != source:
                  raise DistributionError("Preserving an existing extension with the bootstrap identity")

              instructions = instructions.expanduser().resolve()
              try:
                  instructions.relative_to(layout.project.resolve())
              except ValueError as exc:
                  raise DistributionError("Bootstrap instructions escaped the admitted project root") from exc
              owned = receipt.get("owned_files", {})
              expected = owned.get(str(instructions)) if isinstance(owned, dict) else None
              if (
                  not isinstance(expected, str)
                  or not instructions.is_file()
                  or instructions.is_symlink()
                  or hashlib.sha256(instructions.read_bytes()).hexdigest() != expected
              ):
                  raise DistributionError("Bootstrap registry entry requires the exact receipted instructions file")

              proposed = json.loads(json.dumps(registry))
              proposed["extensions"][key] = {
                  **(existing or {}),
                  "id": key,
                  "supported": True,
                  "installed": True,
                  "enabled": (existing or {}).get("enabled", True),
                  "version": "1",
                  "source": source,
                  "instructions": instructions.relative_to(layout.project).as_posix(),
                  "adapters": [],
              }
              evidence = build_structured_payload_evidence(
                  lifecycle=LifecycleVerb.INSTALL,
                  document_id=str(registry_path.resolve()),
                  owned_path=("extensions", key),
                  before=registry,
                  proposed=proposed,
                  operation=(MutationOperation.REPLACE if existing is not None else MutationOperation.CREATE),
                  route=MutationRoute.DISTRIBUTION,
                  ownership=OwnershipClass.GENERATED_SYSTEM_OWNED_REPLACEABLE_WITH_RECEIPT,
                  containment_verified=True,
                  lifecycle_admitted=True,
                  provenance_verified=True,
                  receipt_verified=True,
                  owner_authorized=True,
              )
              require_payload_mutation(evidence)
              _write_json(registry_path, proposed)
              return proposed
          '''.replace("          ", "")
          replace_once("src/aiverse_distribution/project_install.py", old_write_owned, new_write_owned)

          old_registry = '''        registry_path = layout.project / ".aiverse/extensions/registry.json"
                  registry = json.loads(registry_path.read_text(encoding="utf-8"))
                  if registry.get("schema_version") != "1.0" or not isinstance(registry.get("extensions"), dict):
                      raise DistributionError("Cannot register bootstrap instructions in an unknown OS extension registry")
                  key = "ai-verse-project-bootstrap"
                  existing = registry["extensions"].get(key)
                  if existing and existing.get("source") != "ai-verse-distribution/project-bootstrap-v1":
                      raise DistributionError("Preserving an existing extension with the bootstrap identity")
                  registry["extensions"][key] = {**(existing or {}), "id": key, "supported": True,
                      "installed": True, "enabled": (existing or {}).get("enabled", True), "version": "1", "source": "ai-verse-distribution/project-bootstrap-v1",
                      "instructions": instructions.relative_to(layout.project).as_posix(), "adapters": []}
                  _write_json(registry_path, registry)
          '''.replace("          ", "")
          new_registry = '''        registry_path = layout.project / ".aiverse/extensions/registry.json"
                  _register_bootstrap_extension(layout, registry_path, instructions, receipt)
          '''.replace("          ", "")
          replace_once("src/aiverse_distribution/project_install.py", old_registry, new_registry)

          # generated_refresh.py: use the lifecycle payload guard at plan and apply/restore boundaries.
          replace_once(
              "src/aiverse_distribution/generated_refresh.py",
              "from .release_catalog import DistributionError\nfrom .update_safety import (\n    MutationOperation,\n    MutationRoute,\n    OwnershipClass,\n    ProposedMutation,\n    require_mutation_permitted,\n)\n",
              "from .lifecycle_payload import (\n    LifecycleVerb,\n    build_project_file_evidence,\n    require_payload_mutation,\n)\nfrom .project_layout import ProjectLayout\nfrom .release_catalog import DistributionError\nfrom .update_safety import MutationOperation\n",
          )
          replace_once(
              "src/aiverse_distribution/generated_refresh.py",
              "def plan_generated_refresh(\n    *,\n    target_raw: dict[str, Any],\n    project_root: Path,\n    distribution_home: Path,\n) -> list[dict[str, Any]]:\n",
              "def plan_generated_refresh(\n    *,\n    target_raw: dict[str, Any],\n    project_root: Path,\n    distribution_home: Path,\n    lifecycle: LifecycleVerb = LifecycleVerb.UPDATE,\n) -> list[dict[str, Any]]:\n",
          )
          replace_once(
              "src/aiverse_distribution/generated_refresh.py",
              '''    _, receipt = _load_receipt(distribution_home)
              if receipt.get("project") not in (None, str(project_root.resolve())):
                  raise DistributionError("Project receipt belongs to a different project")
              owned = receipt["owned_files"]
          '''.replace("          ", ""),
              '''    receipt_path, receipt = _load_receipt(distribution_home)
              if receipt.get("project") != str(project_root.resolve()):
                  raise DistributionError("Project receipt belongs to a different project")
              stack_text = receipt.get("stack")
              if not isinstance(stack_text, str) or Path(stack_text).expanduser().resolve() != receipt_path.parent.resolve():
                  raise DistributionError("Project receipt does not identify this tool stack")
              layout = ProjectLayout(project_root.resolve(), receipt_path.parent.resolve())
              owned = receipt["owned_files"]
          '''.replace("          ", ""),
          )
          old_policy = '''        require_mutation_permitted(
                      ProposedMutation(
                          path=key,
                          ownership=OwnershipClass.GENERATED_SYSTEM_OWNED_REPLACEABLE_WITH_RECEIPT,
                          operation=MutationOperation.REPLACE,
                          route=MutationRoute.DISTRIBUTION,
                          containment_verified=True,
                          transition_admitted=True,
                          provenance_verified=True,
                          receipt_verified=True,
                          owner_authorized=True,
                          local_modification=False,
                      )
                  )
          '''.replace("          ", "")
          new_policy = '''        evidence = build_project_file_evidence(
                      layout,
                      path,
                      lifecycle=lifecycle,
                      operation=MutationOperation.REPLACE,
                      lifecycle_admitted=True,
                      owner_authorized=True,
                      receipt=receipt,
                  )
                  require_payload_mutation(evidence)
          '''.replace("          ", "")
          replace_once("src/aiverse_distribution/generated_refresh.py", old_policy, new_policy)
          replace_once(
              "src/aiverse_distribution/generated_refresh.py",
              '''                "new_content_utf8": content,
                          "changed": actual != new_digest,
          '''.replace("          ", ""),
              '''                "new_content_utf8": content,
                          "changed": actual != new_digest,
                          "lifecycle": lifecycle.value,
          '''.replace("          ", ""),
          )

          replace_once(
              "src/aiverse_distribution/generated_refresh.py",
              '''    receipt_path, receipt = _load_receipt(distribution_home)
                  owned = receipt["owned_files"]
                  pending = receipt["pending_files"]
                  refreshed: list[str] = []
          '''.replace("          ", ""),
              '''    receipt_path, receipt = _load_receipt(distribution_home)
                  project_text = receipt.get("project")
                  stack_text = receipt.get("stack")
                  if not isinstance(project_text, str) or not isinstance(stack_text, str):
                      raise DistributionError("Project receipt identity is incomplete")
                  layout = ProjectLayout(Path(project_text).expanduser().resolve(), Path(stack_text).expanduser().resolve())
                  if layout.receipt.resolve() != receipt_path.resolve():
                      raise DistributionError("Project receipt does not identify this tool stack")
                  owned = receipt["owned_files"]
                  pending = receipt["pending_files"]
                  refreshed: list[str] = []
          '''.replace("          ", ""),
          )
          replace_once(
              "src/aiverse_distribution/generated_refresh.py",
              '''        if actual == item["new_sha256"]:
                          owned[str(path)] = item["new_sha256"]
                          pending.pop(str(path), None)
                          _atomic_json(receipt_path, receipt)
                          refreshed.append(str(path))
                          continue
                      pending[str(path)] = item["new_sha256"]
          '''.replace("          ", ""),
              '''        if actual == item["new_sha256"]:
                          owned[str(path)] = item["new_sha256"]
                          pending.pop(str(path), None)
                          _atomic_json(receipt_path, receipt)
                          refreshed.append(str(path))
                          continue
                      try:
                          lifecycle = LifecycleVerb(item.get("lifecycle", LifecycleVerb.UPDATE.value))
                      except ValueError as exc:
                          raise DistributionError("Generated refresh plan has an invalid lifecycle") from exc
                      evidence = build_project_file_evidence(
                          layout,
                          path,
                          lifecycle=lifecycle,
                          operation=MutationOperation.REPLACE,
                          lifecycle_admitted=True,
                          owner_authorized=True,
                          receipt=receipt,
                      )
                      require_payload_mutation(evidence)
                      pending[str(path)] = item["new_sha256"]
          '''.replace("          ", ""),
          )

          # The second matching receipt-load block is restore_generated_refresh.
          path = Path("src/aiverse_distribution/generated_refresh.py")
          text = path.read_text(encoding="utf-8")
          marker = '''    receipt_path, receipt = _load_receipt(distribution_home)
              owned = receipt["owned_files"]
              pending = receipt["pending_files"]
              restored: list[str] = []
          '''.replace("          ", "")
          replacement = '''    receipt_path, receipt = _load_receipt(distribution_home)
              project_text = receipt.get("project")
              stack_text = receipt.get("stack")
              if not isinstance(project_text, str) or not isinstance(stack_text, str):
                  raise DistributionError("Project receipt identity is incomplete")
              layout = ProjectLayout(Path(project_text).expanduser().resolve(), Path(stack_text).expanduser().resolve())
              if layout.receipt.resolve() != receipt_path.resolve():
                  raise DistributionError("Project receipt does not identify this tool stack")
              owned = receipt["owned_files"]
              pending = receipt["pending_files"]
              restored: list[str] = []
          '''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit(f"expected one restore receipt marker, found {text.count(marker)}")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          replace_once(
              "src/aiverse_distribution/generated_refresh.py",
              '''        if actual != item["new_sha256"]:
                          raise DistributionError(
                              f"Generated file changed after update; recovery will preserve it rather than overwrite: {path}"
                          )
                      pending[str(path)] = item["old_sha256"]
          '''.replace("          ", ""),
              '''        if actual != item["new_sha256"]:
                          raise DistributionError(
                              f"Generated file changed after update; recovery will preserve it rather than overwrite: {path}"
                          )
                      evidence = build_project_file_evidence(
                          layout,
                          path,
                          lifecycle=LifecycleVerb.ROLLBACK,
                          operation=MutationOperation.REPLACE,
                          lifecycle_admitted=True,
                          owner_authorized=True,
                          receipt=receipt,
                      )
                      require_payload_mutation(evidence)
                      pending[str(path)] = item["old_sha256"]
          '''.replace("          ", ""),
          )

          # core_update.py: preserve existing journal/recovery, only carry the exact lifecycle into generated refresh.
          replace_once(
              "src/aiverse_distribution/core_update.py",
              "from .infrastructure_gate import InfrastructureUpdateGate, require_update_activation\n",
              "from .infrastructure_gate import InfrastructureUpdateGate, require_update_activation\nfrom .lifecycle_payload import LifecycleVerb\n",
          )
          replace_once(
              "src/aiverse_distribution/core_update.py",
              '''            generated_plan = plan_generated_refresh(
                              target_raw=target.raw,
                              project_root=root,
                              distribution_home=self.state.home,
                          )
          '''.replace("          ", ""),
              '''            generated_plan = plan_generated_refresh(
                              target_raw=target.raw,
                              project_root=root,
                              distribution_home=self.state.home,
                              lifecycle=(
                                  LifecycleVerb.ROLLBACK
                                  if transition_kind == "rollback"
                                  else LifecycleVerb.UPDATE
                              ),
                          )
          '''.replace("          ", ""),
          )

          # Documentation: move the boundary from T1 definition to T2 adopted wiring.
          replace_once(
              "docs/MEMBER-PAYLOAD-GUARD.md",
              "Status: Slice 5.2 T1 reusable policy boundary\n",
              "Status: Slice 5.2 T2 adopted lifecycle wiring\n",
          )
          replace_once(
              "docs/MEMBER-PAYLOAD-GUARD.md",
              "## Slice boundary\n\nT1 only defines and validates this reusable evidence/guard layer. It does not wire install/setup/update/rollback callers to it. That integration is exclusively Slice 5.2 T2.\n",
              "## Adopted T2 wiring\n\nT2 routes direct Distribution member-payload writes through this guard without moving owner state into Distribution. Bootstrap-owned published files use the existing project receipt before CREATE/REPLACE. The shared OS extension registry is changed only at `/extensions/ai-verse-project-bootstrap`, with exact structured diff confinement and provenance tied to the receipted bootstrap instructions file. Generated update refreshes are checked at both plan and apply time, and rollback/recovery restores use the same guard with the rollback lifecycle. Owner setup, owner migration, owner reconcile, Data workspace initialization and system-host attachment remain owner-controlled lifecycle calls. Core transition admission, journaling, health verification, interruption recovery and software-only rollback semantics are unchanged.\n\nT2 does not claim lifecycle-wide populated-root acceptance. That destructive positive/negative proof remains exclusively Slice 5.2 T3.\n",
          )

          tests = r'''import hashlib
          import inspect
          import json
          import tempfile
          import unittest
          from pathlib import Path
          from unittest.mock import patch

          from aiverse_distribution.core_update import CoreUpdateOrchestrator
          from aiverse_distribution.generated_refresh import (
              apply_generated_refresh,
              plan_generated_refresh,
              restore_generated_refresh,
          )
          from aiverse_distribution.lifecycle_payload import LifecycleVerb, require_payload_mutation
          from aiverse_distribution.project_install import (
              _register_bootstrap_extension,
              _write_owned,
          )
          from aiverse_distribution.project_layout import ProjectLayout


          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          class LifecyclePayloadWiringTests(unittest.TestCase):
              def _layout(self, folder: str):
                  base = Path(folder)
                  layout = ProjectLayout.resolve(base / "project", base / "stack")
                  layout.project.mkdir(parents=True)
                  layout.stack.mkdir(parents=True)
                  receipt = {
                      "schema_version": 1,
                      "project": str(layout.project),
                      "stack": str(layout.stack),
                      "owned_files": {},
                      "pending_files": {},
                  }
                  layout.receipt.write_text(json.dumps(receipt), encoding="utf-8")
                  return layout, receipt

              def test_bootstrap_publication_requires_shared_guard_before_target_write(self):
                  with tempfile.TemporaryDirectory() as folder:
                      layout, receipt = self._layout(folder)
                      target = layout.stack / "run.py"
                      with patch(
                          "aiverse_distribution.project_install.require_payload_mutation",
                          side_effect=RuntimeError("guard stopped publication"),
                      ):
                          with self.assertRaisesRegex(RuntimeError, "guard stopped publication"):
                              _write_owned(layout, target, "generated launcher\n", receipt)
                      self.assertFalse(target.exists())
                      self.assertFalse(target.with_name("run.py.bootstrap-pending").exists())

              def test_shared_registry_updates_only_distribution_owned_slice(self):
                  with tempfile.TemporaryDirectory() as folder:
                      layout, receipt = self._layout(folder)
                      instructions = layout.project / ".aiverse/extensions/project-bootstrap/INSTRUCTIONS.md"
                      _write_owned(layout, instructions, "bootstrap instructions\n", receipt)
                      registry_path = layout.project / ".aiverse/extensions/registry.json"
                      registry_path.parent.mkdir(parents=True, exist_ok=True)
                      original_member = {"enabled": True, "custom": "keep-me"}
                      registry_path.write_text(
                          json.dumps(
                              {
                                  "schema_version": "1.0",
                                  "extensions": {"member-extension": original_member},
                              },
                              indent=2,
                          ) + "\n",
                          encoding="utf-8",
                      )
                      with patch(
                          "aiverse_distribution.project_install.require_payload_mutation",
                          wraps=require_payload_mutation,
                      ) as guard:
                          updated = _register_bootstrap_extension(
                              layout, registry_path, instructions, receipt
                          )
                      self.assertEqual(updated["extensions"]["member-extension"], original_member)
                      on_disk = json.loads(registry_path.read_text(encoding="utf-8"))
                      self.assertEqual(on_disk["extensions"]["member-extension"], original_member)
                      self.assertEqual(
                          on_disk["extensions"]["ai-verse-project-bootstrap"]["source"],
                          "ai-verse-distribution/project-bootstrap-v1",
                      )
                      self.assertEqual(guard.call_count, 1)
                      evidence = guard.call_args.args[0]
                      self.assertEqual(evidence.lifecycle, LifecycleVerb.INSTALL)
                      self.assertEqual(
                          evidence.structured_paths,
                          (("extensions", "ai-verse-project-bootstrap"),),
                      )

              def _generated_fixture(self, folder: str):
                  base = Path(folder)
                  project = base / "project"
                  stack = base / "stack"
                  home = stack / "d"
                  project.mkdir(parents=True)
                  home.mkdir(parents=True)
                  target = project / ".aiverse/extensions/project-bootstrap/INSTRUCTIONS.md"
                  target.parent.mkdir(parents=True)
                  old = b"old generated instructions\n"
                  target.write_bytes(old)
                  receipt = {
                      "schema_version": 1,
                      "project": str(project.resolve()),
                      "stack": str(stack.resolve()),
                      "owned_files": {str(target.resolve()): sha(old)},
                      "pending_files": {},
                  }
                  (stack / "project.json").write_text(json.dumps(receipt), encoding="utf-8")
                  raw = {
                      "distribution_generated_files": [
                          {
                              "scope": "project",
                              "path": ".aiverse/extensions/project-bootstrap/INSTRUCTIONS.md",
                              "owner": "ai-verse-distribution/project-bootstrap-v1",
                              "content_utf8": "new generated instructions\n",
                          }
                      ]
                  }
                  return project, home, target, raw

              def test_generated_update_apply_and_recovery_share_lifecycle_guard(self):
                  with tempfile.TemporaryDirectory() as folder:
                      project, home, target, raw = self._generated_fixture(folder)
                      with patch(
                          "aiverse_distribution.generated_refresh.require_payload_mutation",
                          wraps=require_payload_mutation,
                      ) as guard:
                          plan = plan_generated_refresh(
                              target_raw=raw,
                              project_root=project,
                              distribution_home=home,
                              lifecycle=LifecycleVerb.UPDATE,
                          )
                          self.assertEqual(plan[0]["lifecycle"], "update")
                          apply_generated_refresh(plan=plan, distribution_home=home)
                          restore_generated_refresh(backups=plan, distribution_home=home)
                      self.assertEqual(target.read_text(encoding="utf-8"), "old generated instructions\n")
                      lifecycles = [call.args[0].lifecycle for call in guard.call_args_list]
                      self.assertEqual(
                          lifecycles,
                          [LifecycleVerb.UPDATE, LifecycleVerb.UPDATE, LifecycleVerb.ROLLBACK],
                      )

              def test_generated_plan_can_be_bound_to_explicit_rollback(self):
                  with tempfile.TemporaryDirectory() as folder:
                      project, home, _, raw = self._generated_fixture(folder)
                      plan = plan_generated_refresh(
                          target_raw=raw,
                          project_root=project,
                          distribution_home=home,
