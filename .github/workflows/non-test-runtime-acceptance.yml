name: Non-test Gateway runtime acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['tests/acceptance/non_test_runtime_acceptance.py','.github/workflows/non-test-runtime-acceptance.yml']
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"; echo 'GIT_CONFIG_KEY_0=core.longpaths' >> "$GITHUB_ENV"; echo 'GIT_CONFIG_VALUE_0=true' >> "$GITHUB_ENV"
      - run: python -m pip install -e .
      - run: python tests/acceptance/non_test_runtime_acceptance.py
        env:
          AI_VERSE_ACCEPTANCE_RELEASE_SET: agent-public-beta-2026-09-14
