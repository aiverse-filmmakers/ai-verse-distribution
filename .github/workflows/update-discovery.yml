name: Installed update discovery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-discovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Preserve exact source bytes
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      # This checkout stands in for the official updater source, so an unmerged
      # change is qualified through the whole discovery flow before it reaches main.
      - name: Qualify old packaged catalog through installed default update (this checkout)
        run: python tests/acceptance/update_discovery_acceptance.py --source-mirror
      # The real published main can only prove code that is already on main.
      - name: Qualify old packaged catalog through installed default update (published main)
        if: github.event_name != 'pull_request'
        run: python tests/acceptance/update_discovery_acceptance.py

  oldest-supported:
    name: oldest supported Core walks every hop
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Preserve exact source bytes
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      # 42b5615 is the last Distribution commit whose default Core was
      # core-stable-2026-10-10, the oldest Core with a qualified forward path. It
      # predates update discovery, so the one-time tooling refresh is simulated by
      # the fixture exactly as documented in docs/UPDATE-DISCOVERY.md.
      - name: Update the oldest supported Core to the default through every qualified hop
        run: python tests/acceptance/update_discovery_acceptance.py --source-mirror --old-distribution 42b561554f91b2d3a54f5eb21850ab9693b3a233 --old-core core-stable-2026-10-10 --old-has-discovery no
