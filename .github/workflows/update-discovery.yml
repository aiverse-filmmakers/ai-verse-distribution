name: Installed update discovery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: update-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-discovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Preserve exact source bytes
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Qualify old packaged catalog through installed default update
        run: python tests/acceptance/update_discovery_acceptance.py
