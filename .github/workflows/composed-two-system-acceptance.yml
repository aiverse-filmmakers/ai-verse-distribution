name: Composed Two-System Isolation Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Only on this qualification PR: the committed release catalog and default
      # Agent channel remain unmodified. The runner injects a disposable
      # exact-Gateway candidate before packaging Distribution.
      - name: Stage exact Gateway Windows candidate (PR-only)
        if: github.event_name == 'pull_request' && github.head_ref == 'qualification/gateway-windows-2026-10-23'
        shell: bash
        run: python tests/acceptance/gateway_windows_candidate_fixture.py
      - name: Install Distribution
        run: python -m pip install .
      - name: Prove two isolated systems concurrently
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "true"
        run: python tests/acceptance/composed_two_system_acceptance.py
