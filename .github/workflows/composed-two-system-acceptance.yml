name: Composed Two-System Isolation Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Distribution
        run: python -m pip install .
      - name: Prove two isolated systems concurrently
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "true"
        run: python tests/acceptance/composed_two_system_acceptance.py
