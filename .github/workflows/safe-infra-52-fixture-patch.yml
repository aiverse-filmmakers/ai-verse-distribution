name: Safe Infrastructure Slice 5.2 Fixture Patch

on:
  push:
    branches: [safe-infrastructure-5.2-convergence]
    paths:
      - .github/workflows/safe-infra-52-fixture-patch.yml

permissions:
  contents: write

jobs:
  patch-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align fixture with declared file-level LKG coverage
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/safe-infra-52-real-convergence.py')
          text = path.read_text(encoding='utf-8')
          old = '            require(not target_path.exists(), "post-LKG promoted target survived restore")\n'
          new = '            require(not target_path.exists() or not any(item.is_file() or item.is_symlink() for item in target_path.rglob("*")), "post-LKG promoted target retained covered files after restore")\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exact restore assertion once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fixture correction and remove temporary patch workflow
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/safe-infrastructure-5.2-convergence | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/safe-infra-52-fixture-patch.yml
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add -A
          git diff --cached --quiet && { echo 'No fixture correction produced' >&2; exit 1; }
          git commit -m "Align Slice 5.2 restore assertion with LKG coverage"
          git push origin HEAD:safe-infrastructure-5.2-convergence
