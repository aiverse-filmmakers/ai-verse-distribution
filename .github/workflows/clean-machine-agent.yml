name: Clean Machine Agent Release Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin tested npm major
        run: npm install --global npm@10.9.2
      - name: Verify runtimes
        run: |
          python --version
          node --version
          npm --version
      - name: Install Distribution
        run: python -m pip install .
      - name: Prove Agent from a clean machine
        run: python tests/acceptance/agent_acceptance.py
