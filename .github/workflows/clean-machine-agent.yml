name: Clean Machine Agent Release Gate

on:
  workflow_dispatch:

jobs:
  agent-release-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Distribution
        run: python -m pip install .
      - name: Run Agent clean-machine gate
        run: python tests/acceptance/profile_acceptance.py agent
