name: Clean Machine Core Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Pin tested npm major
        run: npm install --global npm@10.9.2
      - name: Verify Node and npm
        run: |
          node --version
          npm --version
      - name: Install Distribution
        run: python -m pip install .
      - name: Prove Core from a clean machine
        run: python tests/acceptance/profile_acceptance.py core

  local-upgrades-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      AI_VERSE_ACCEPTANCE_RELEASE_SET: core-local-upgrades-candidate-2026-10-19-v6
      AI_VERSE_ACCEPTANCE_EXPECT_LATEST_CORE_RELEASE: ${{ github.ref == 'refs/heads/main' && 'core-local-upgrades-candidate-2026-10-19-v6' || 'core-first-run-rc1-2026-10-12' }}
      AI_VERSE_ACCEPTANCE_EXPECTED_REFS: '{"ai-verse-os":"558f4ecb2f6810b10a0e152bfcf610e725fc7032","ai-verse-brain":"f746806e4361c2b1cd67ee97810071cc86db7b9a","ai-verse-memory":"f1327be48ba2ee0043959021365e6dbb9dcb1d3a","ai-verse-skills":"afde5c06307fba7d074de2929c2eb6c3dc6bdab8","ai-verse-data":"f8978f8f7a1bc94edecddc2662112233289159a3"}'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Pin tested npm major
        run: npm install --global npm@10.9.2
      - name: Preserve exact source bytes on Windows checkouts
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Verify Node and npm
        run: |
          python --version
          node --version
          npm --version
      - name: Install Distribution
        run: python -m pip install .
      - name: Prove the exact local-upgrades Core release from a clean machine
        run: python tests/acceptance/profile_acceptance.py core
      - name: Prove a populated update from current Core and preservation of member state
        run: python tests/acceptance/core_update_candidate_acceptance.py
      - name: Prove optional package lifecycle and member-state preservation
        run: python tests/acceptance/optional_package_candidate_acceptance.py
