name: Purpose Context Slice 12.3 Agent Qualification

on:
  pull_request:
    paths:
      - 'qualification/purpose-context/**'
      - 'scripts/prepare-purpose-agent-candidate-qualification.py'
      - '.github/workflows/purpose-context-slice-12-3-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purpose-context-slice-12-3-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-agent-composed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Pin tested npm major
        run: npm install --global npm@10.9.2
      - name: Prove exact Purpose Agent and composed runtime candidate
        shell: bash
        run: bash qualification/purpose-context/test-agent-composed-candidate.sh
