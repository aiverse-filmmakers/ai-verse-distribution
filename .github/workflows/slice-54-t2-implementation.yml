name: Slice 5.4 T2 implementation

on:
  push:
    branches:
      - slice-5.4-t2-release-receipt-admission

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded T2 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {text.count(old)}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              try:
                  left = text.index(start)
                  right = text.index(end, left)
              except ValueError as exc:
                  raise SystemExit(f"{label}: boundary not found") from exc
              return text[:left] + replacement + text[right:]

          promotion_path = Path('src/aiverse_distribution/core_promotion.py')
          text = promotion_path.read_text(encoding='utf-8')
          text = replace_once(text, 'import os\n', 'import os\nimport tempfile\n', 'tempfile import')

          atomic_old = '''def _write_json_atomic(path: Path, payload: Mapping[str, Any]) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temporary = path.with_name(path.name + ".tmp")\n    temporary.write_text(json.dumps(payload, indent=2) + "\\n", encoding="utf-8")\n    os.replace(temporary, path)\n'''
          atomic_new = atomic_old + '''\n\ndef _write_json_atomic_immutable(path: Path, payload: Mapping[str, Any]) -> None:\n    """Publish fully written immutable JSON without any overwrite window."""\n    path.parent.mkdir(parents=True, exist_ok=True)\n    fd, temporary_name = tempfile.mkstemp(\n        prefix=f".{path.name}.",\n        suffix=".tmp",\n        dir=path.parent,\n    )\n    temporary = Path(temporary_name)\n    try:\n        with os.fdopen(fd, "w", encoding="utf-8") as handle:\n            handle.write(json.dumps(payload, indent=2) + "\\n")\n            handle.flush()\n            os.fsync(handle.fileno())\n        try:\n            os.link(temporary, path)\n        except FileExistsError as exc:\n            raise CorePromotionError(\n                f"{path}: immutable release evidence already exists; history will not be overwritten"\n            ) from exc\n    finally:\n        temporary.unlink(missing_ok=True)\n'''
          text = replace_once(text, atomic_old, atomic_new, 'immutable atomic writer')

          evidence_old = '''    evidence = copy.deepcopy(release.get("evidence", {}))\n    evidence["whole_product_qualification"] = {\n'''
          evidence_new = '''    evidence = copy.deepcopy(release.get("evidence", {}))\n    receipt_ref = f"qualification/{candidate_id}/release-receipt.json"\n    from .release_receipt import SCHEMA_ID as RELEASE_RECEIPT_SCHEMA\n\n    evidence["release_receipt"] = {\n        "schema_version": RELEASE_RECEIPT_SCHEMA,\n        "receipt_ref": receipt_ref,\n        "binding": "receipt-binds-final-release-set",\n    }\n    evidence["whole_product_qualification"] = {\n'''
          text = replace_once(text, evidence_old, evidence_new, 'release receipt reference')

          writes_old = '''            "src/aiverse_distribution/catalog/core_promotions.json",\n            "src/aiverse_distribution/catalog/core_candidates.json",\n            f"release-sets/{candidate_id}.json",\n            f"qualification/{candidate_id}/promotion.json",\n'''
          writes_new = '''            "src/aiverse_distribution/catalog/core_promotions.json",\n            "src/aiverse_distribution/catalog/core_candidates.json",\n            f"release-sets/{candidate_id}.json",\n            receipt_ref,\n            f"qualification/{candidate_id}/promotion.json",\n'''
          text = replace_once(text, writes_old, writes_new, 'promotion write set')

          return_old = '''        "public_manifest": {"schema_version": 1, **release},\n        "promotion_evidence": promotion_evidence,\n    }\n'''
          return_new = '''        "public_manifest": {"schema_version": 1, **release},\n        "promotion_evidence": promotion_evidence,\n        "release_receipt_ref": receipt_ref,\n    }\n'''
          text = replace_once(text, return_old, return_new, 'plan receipt return')

          apply_new = '''def apply_core_promotion(\n    root: str | Path,\n    candidate_id: str,\n    qualification_ref: str,\n    registry_snapshot: bytes,\n    repository_state_snapshot: bytes,\n    *,\n    mode: str = "normal",\n    emergency_reason: str | None = None,\n) -> dict[str, Any]:\n    """Apply one explicit promotion only after durable reconstruction evidence is valid."""\n    root = Path(root)\n    public_path = root / "release-sets" / f"{candidate_id}.json"\n    evidence_path = root / "qualification" / candidate_id / "promotion.json"\n    receipt_path = root / "qualification" / candidate_id / "release-receipt.json"\n    immutable_outputs = (public_path, evidence_path, receipt_path)\n    if any(path.exists() for path in immutable_outputs):\n        raise CorePromotionError(\n            f"{candidate_id}: final admission outputs already exist; immutable history will not be overwritten"\n        )\n\n    plan = plan_core_promotion(\n        root,\n        candidate_id,\n        qualification_ref,\n        registry_snapshot,\n        repository_state_snapshot,\n        mode=mode,\n        emergency_reason=emergency_reason,\n    )\n    promotion_evidence = copy.deepcopy(plan["promotion_evidence"])\n    promotion_evidence["status"] = "applied"\n\n    qualification, _ = _qualification(root, candidate_id, qualification_ref)\n    bindings = qualification.get("bindings")\n    preservation = bindings.get("preservation") if isinstance(bindings, dict) else None\n    composed = bindings.get("composed_acceptance") if isinstance(bindings, dict) else None\n    preservation_ref = preservation.get("path") if isinstance(preservation, dict) else None\n    composed_ref = composed.get("path") if isinstance(composed, dict) else None\n    if not isinstance(preservation_ref, str) or not isinstance(composed_ref, str):\n        raise CorePromotionError(\n            f"{candidate_id}: final admission requires immutable preservation and composed-acceptance source refs"\n        )\n\n    debt_ids = promotion_evidence.get("system_sync", {}).get("debt_ids", [])\n    debt_id_set = set(debt_ids) if isinstance(debt_ids, list) else set()\n    all_debts = plan["core_promotions"].get("system_sync_debts", [])\n    receipt_debts = [\n        copy.deepcopy(item)\n        for item in all_debts\n        if isinstance(item, dict) and item.get("id") in debt_id_set\n    ]\n\n    from .release_receipt import (\n        ReleaseReceiptError,\n        build_release_receipt,\n        validate_release_receipt,\n    )\n\n    try:\n        receipt = build_release_receipt(\n            root,\n            plan["public_manifest"],\n            qualification_ref,\n            preservation_ref,\n            composed_ref,\n            f"qualification/{candidate_id}/promotion.json",\n            promotion_evidence,\n            system_sync_debts=receipt_debts,\n        )\n        validate_release_receipt(\n            root,\n            receipt,\n            release_set=plan["public_manifest"],\n            promotion_evidence=promotion_evidence,\n            system_sync_debts=receipt_debts,\n        )\n    except ReleaseReceiptError as exc:\n        raise CorePromotionError(\n            f"{candidate_id}: durable release receipt is invalid: {exc}"\n        ) from exc\n\n    # The durable receipt is fully built and validated before any promotion/channel mutation.\n    # Publish it atomically and exclusively, then persist its bound evidence before moving the channel.\n    _write_json_atomic_immutable(receipt_path, receipt)\n    persisted_receipt, _ = _load_json(receipt_path, "durable release receipt")\n    if persisted_receipt != receipt:\n        raise CorePromotionError(\n            f"{candidate_id}: durable release receipt changed during immutable publication"\n        )\n\n    _write_json_atomic(public_path, plan["public_manifest"])\n    _write_json_atomic(evidence_path, promotion_evidence)\n    _write_json_atomic(\n        root / "src/aiverse_distribution/catalog/core_promotions.json",\n        plan["core_promotions"],\n    )\n    _write_json_atomic(\n        root / "src/aiverse_distribution/catalog/core_candidates.json",\n        plan["core_candidates"],\n    )\n    return {\n        **plan,\n        "promotion_evidence": promotion_evidence,\n        "release_receipt": receipt,\n    }\n\n\n'''
          text = replace_between(
              text,
              'def apply_core_promotion(\n',
              'def reconcile_system_sync_debt(\n',
              apply_new,
              'apply_core_promotion',
          )

          governance_anchor = '''        if (\n            not isinstance(qualification, dict)\n            or qualification.get("status") != "accepted"\n            or qualification.get("schema_version") != WHOLE_PRODUCT_QUALIFICATION_SCHEMA\n            or not isinstance(qualification.get("qualification_ref"), str)\n            or not isinstance(qualification.get("sha256"), str)\n            or len(qualification["sha256"]) != 64\n        ):\n            raise CorePromotionError(f"{release_id}: future Core promotion lacks exact qualification evidence")\n'''
          governance_insert = governance_anchor + '''        receipt_binding = release.get("evidence", {}).get("release_receipt")\n        from .release_receipt import SCHEMA_ID as RELEASE_RECEIPT_SCHEMA\n\n        expected_receipt_ref = f"qualification/{release_id}/release-receipt.json"\n        if (\n            not isinstance(receipt_binding, dict)\n            or set(receipt_binding) != {"schema_version", "receipt_ref", "binding"}\n            or receipt_binding.get("schema_version") != RELEASE_RECEIPT_SCHEMA\n            or receipt_binding.get("receipt_ref") != expected_receipt_ref\n            or receipt_binding.get("binding") != "receipt-binds-final-release-set"\n        ):\n            raise CorePromotionError(\n                f"{release_id}: future Core promotion lacks a non-cyclic durable release-receipt reference"\n            )\n'''
          text = replace_once(text, governance_anchor, governance_insert, 'governance receipt requirement')
          promotion_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_core_promotion.py')
          tests = test_path.read_text(encoding='utf-8')
          candidate_start = '        candidate_evidence = {\n'
          candidate_end = '        candidate_evidence_path = root / f"qualification/{candidate_id}/candidate-evidence.json"\n'
          candidate_block = '''        evidence_components = []\n        qualification_owners = []\n        for index, component in enumerate(candidate["components"], start=1):\n            descriptor_revision = format(index, "x") * 40\n            descriptor_sha = hashlib.sha256(\n                f"{component['id']}:{descriptor_revision}".encode("utf-8")\n            ).hexdigest()\n            owner_acceptance = {\n                "kind": "github-actions",\n                "accepted_revision": component["revision"],\n                "evidence_revision": descriptor_revision,\n                "workflow": "Owner Native CI",\n                "run_id": 123450 + index,\n                "result": "success",\n            }\n            evidence_components.append(\n                {\n                    "id": component["id"],\n                    "repository": component["repository"],\n                    "revision": component["revision"],\n                    "descriptor": {\n                        "path": "release/component-release.json",\n                        "source_revision": descriptor_revision,\n                        "sha256": descriptor_sha,\n                    },\n                    "owner_acceptance": owner_acceptance,\n                }\n            )\n            qualification_owners.append(\n                {\n                    "component_id": component["id"],\n                    "revision": component["revision"],\n                    "descriptor_source_revision": descriptor_revision,\n                    "descriptor_sha256": descriptor_sha,\n                }\n            )\n\n        compatibility_sha = hashlib.sha256(\n            json.dumps(\n                compatibility, sort_keys=True, separators=(",", ":")\n            ).encode("utf-8")\n        ).hexdigest()\n        preservation = {\n            "schema_version": "ai-verse.release-preservation/v1",\n            "source_release_set": CURRENT,\n            "target_release_set": candidate_id,\n            "status": "safe",\n        }\n        composed = {\n            "schema_version": "aiverse.distribution-composed-acceptance/v1",\n            "release_set_id": candidate_id,\n            "status": "passed",\n        }\n        preservation_ref = f"qualification/{candidate_id}/preservation.json"\n        composed_ref = f"qualification/{candidate_id}/composed-acceptance.json"\n        _write(root / preservation_ref, preservation)\n        _write(root / composed_ref, composed)\n        preservation_sha = hashlib.sha256(\n            json.dumps(\n                preservation, sort_keys=True, separators=(",", ":")\n            ).encode("utf-8")\n        ).hexdigest()\n        composed_sha = hashlib.sha256(\n            json.dumps(\n                composed, sort_keys=True, separators=(",", ":")\n            ).encode("utf-8")\n        ).hexdigest()\n\n        candidate_evidence = {\n            "candidate_id": candidate_id,\n            "registry": {\n                "revision": "c" * 40,\n                "path": "governance/repository-registry.json",\n                "sha256": _sha(registry_raw),\n            },\n            "repository_state": {\n                "revision": "d" * 40,\n                "path": "governance/repository-state.json",\n                "sha256": _sha(state_raw),\n                "scope": "core",\n                "repositories": names,\n            },\n            "components": evidence_components,\n            "compatibility": {\n                "sha256": compatibility_sha,\n                "inputs": ["src/aiverse_distribution/catalog/core_candidates.json"],\n            },\n            "toolchain": {\n                "dependency_locks": [],\n                "runtime_requirements": {"python": ">=3.11"},\n            },\n        }\n'''
          tests = replace_between(tests, candidate_start, candidate_end, candidate_block, 'promotion fixture candidate evidence')

          bindings_old = '''            "distribution_revision": "e" * 40,\n            "gates": gates,\n            "bindings": {\n                "candidate_evidence": binding,\n                "system": {"revision": "f" * 40},\n                "registry": candidate_evidence["registry"],\n                "repository_state": {\n                    key: candidate_evidence["repository_state"][key]\n                    for key in ("revision", "path", "sha256", "scope")\n                },\n            },\n'''
          bindings_new = '''            "distribution_revision": "e" * 40,\n            "source_release_set": CURRENT,\n            "gates": gates,\n            "bindings": {\n                "candidate_evidence": binding,\n                "system": {"revision": "f" * 40},\n                "registry": candidate_evidence["registry"],\n                "repository_state": {\n                    key: candidate_evidence["repository_state"][key]\n                    for key in ("revision", "path", "sha256", "scope")\n                },\n                "owners": qualification_owners,\n                "compatibility_sha256": compatibility_sha,\n                "preservation_sha256": preservation_sha,\n                "composed_acceptance_sha256": composed_sha,\n                "preservation": {\n                    "path": preservation_ref,\n                    "sha256": preservation_sha,\n                },\n                "composed_acceptance": {\n                    "path": composed_ref,\n                    "sha256": composed_sha,\n                },\n            },\n'''
          tests = replace_once(tests, bindings_old, bindings_new, 'promotion fixture qualification bindings')
          test_path.write_text(tests, encoding='utf-8')

          t2_tests = Path('tests/test_release_receipt_admission.py')
          t2_tests.write_text(r'''import hashlib
import json
import unittest

import test_core_promotion as core_promotion_fixtures
from aiverse_distribution.core_promotion import (
    CorePromotionError,
    apply_core_promotion,
    plan_core_promotion,
    validate_core_promotion_governance,
)
from aiverse_distribution.release_receipt import SCHEMA_ID, validate_release_receipt


def _sha(content: bytes) -> str:
    return hashlib.sha256(content).hexdigest()


class DurableReleaseAdmissionTests(unittest.TestCase):
    def fixture(self, candidate_id="core-t2-durable", *, debt=False):
        helper = core_promotion_fixtures.CorePromotionTests(
            methodName="test_non_passing_whole_product_qualification_cannot_promote"
        )
        self.addCleanup(helper.doCleanups)
        return helper.fixture(candidate_id, debt=debt)

    def test_final_admission_persists_non_cyclic_receipt_before_channel_release(self):
        root, candidate_id, qualification_ref, registry, state, _ = self.fixture()
        result = apply_core_promotion(
            root,
            candidate_id,
            qualification_ref,
            registry,
            state,
        )

        receipt_path = root / "qualification" / candidate_id / "release-receipt.json"
        manifest_path = root / "release-sets" / f"{candidate_id}.json"
        promotion_path = root / "qualification" / candidate_id / "promotion.json"
        self.assertTrue(receipt_path.exists())
        self.assertTrue(manifest_path.exists())
        self.assertTrue(promotion_path.exists())

        receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
        manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
        reference = manifest["evidence"]["release_receipt"]
        self.assertEqual(reference["schema_version"], SCHEMA_ID)
        self.assertEqual(
            reference["receipt_ref"],
            f"qualification/{candidate_id}/release-receipt.json",
        )
        self.assertEqual(reference["binding"], "receipt-binds-final-release-set")
        self.assertEqual(set(reference), {"schema_version", "receipt_ref", "binding"})
        self.assertEqual(receipt["release_set"]["sha256"], _sha(manifest_path.read_bytes()))
        self.assertEqual(result["release_receipt"], receipt)
        self.assertEqual(validate_release_receipt(root, receipt), receipt)

        promotions = json.loads(
            (root / "src/aiverse_distribution/catalog/core_promotions.json").read_text(
                encoding="utf-8"
            )
        )
        self.assertEqual(promotions["current_release"], candidate_id)
        validate_core_promotion_governance(promotions)

    def test_missing_reconstruction_evidence_fails_before_catalog_or_channel_mutation(self):
        root, candidate_id, qualification_ref, registry, state, _ = self.fixture(
            "core-t2-missing-evidence"
        )
        promotions_path = root / "src/aiverse_distribution/catalog/core_promotions.json"
        candidates_path = root / "src/aiverse_distribution/catalog/core_candidates.json"
        before_promotions = promotions_path.read_bytes()
        before_candidates = candidates_path.read_bytes()
        (root / "qualification" / candidate_id / "composed-acceptance.json").unlink()

        with self.assertRaisesRegex(CorePromotionError, "durable release receipt is invalid"):
            apply_core_promotion(
                root,
                candidate_id,
                qualification_ref,
                registry,
                state,
            )

        self.assertEqual(promotions_path.read_bytes(), before_promotions)
        self.assertEqual(candidates_path.read_bytes(), before_candidates)
        self.assertFalse((root / "qualification" / candidate_id / "release-receipt.json").exists())
        self.assertFalse((root / "release-sets" / f"{candidate_id}.json").exists())
        self.assertFalse((root / "qualification" / candidate_id / "promotion.json").exists())

    def test_existing_receipt_is_never_overwritten_and_blocks_before_mutation(self):
        root, candidate_id, qualification_ref, registry, state, _ = self.fixture(
            "core-t2-existing-receipt"
        )
        receipt_path = root / "qualification" / candidate_id / "release-receipt.json"
        receipt_path.parent.mkdir(parents=True, exist_ok=True)
        sentinel = b'{"sentinel":true}\n'
        receipt_path.write_bytes(sentinel)
        promotions_path = root / "src/aiverse_distribution/catalog/core_promotions.json"
        candidates_path = root / "src/aiverse_distribution/catalog/core_candidates.json"
        before_promotions = promotions_path.read_bytes()
        before_candidates = candidates_path.read_bytes()

        with self.assertRaisesRegex(CorePromotionError, "immutable history will not be overwritten"):
            apply_core_promotion(
                root,
                candidate_id,
                qualification_ref,
                registry,
                state,
            )

        self.assertEqual(receipt_path.read_bytes(), sentinel)
        self.assertEqual(promotions_path.read_bytes(), before_promotions)
        self.assertEqual(candidates_path.read_bytes(), before_candidates)

    def test_emergency_final_admission_receipt_binds_exact_new_sync_debt(self):
        root, candidate_id, qualification_ref, registry, state, _ = self.fixture(
            "core-t2-emergency", debt=True
        )
        result = apply_core_promotion(
            root,
            candidate_id,
            qualification_ref,
            registry,
            state,
            mode="emergency",
            emergency_reason="bounded non-safety System synchronization debt",
        )
        receipt = result["release_receipt"]
        debt_ids = result["promotion_evidence"]["system_sync"]["debt_ids"]
        self.assertEqual(receipt["promotion"]["system_sync"]["status"], "debt")
        self.assertEqual(receipt["promotion"]["system_sync"]["debt_ids"], debt_ids)
        self.assertEqual(
            [item["id"] for item in receipt["promotion"]["system_sync"]["debt_snapshot"]],
            debt_ids,
        )
        self.assertEqual(validate_release_receipt(root, receipt), receipt)

    def test_governance_rejects_cyclic_or_unbound_future_receipt_reference(self):
        root, candidate_id, qualification_ref, registry, state, _ = self.fixture(
            "core-t2-governance"
        )
        plan = plan_core_promotion(
            root,
            candidate_id,
            qualification_ref,
            registry,
            state,
        )
        release = next(
            item for item in plan["core_promotions"]["release_sets"] if item["id"] == candidate_id
        )
        release["evidence"]["release_receipt"]["sha256"] = "0" * 64
        with self.assertRaisesRegex(CorePromotionError, "non-cyclic durable release-receipt reference"):
            validate_core_promotion_governance(plan["core_promotions"])


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          docs_path = Path('docs/RELEASE-RECEIPT.md')
          docs = docs_path.read_text(encoding='utf-8')
          addition = '''\n## Final-admission persistence\n\nFuture Core final admission now treats the durable receipt as a mandatory precondition, not a post-release report. `apply_core_promotion` builds and validates the complete receipt in memory before any promotion/channel catalog mutation, then atomically publishes `qualification/<release-id>/release-receipt.json` with immutable no-overwrite semantics. The bound public release manifest and applied promotion evidence are persisted before the live Core promotion ledger moves the default channel.\n\nThe final release-set evidence contains only the receipt schema, repository-relative receipt path and the directional binding `receipt-binds-final-release-set`. It deliberately contains no receipt digest. The receipt instead hashes the final release-set bytes, which avoids a digest cycle while still making later reconstruction exact. Missing, changed or unreadable preservation/composed/qualification/promotion inputs fail closed before channel mutation.\n\nThis durable source release receipt remains separate from the mutable local member lifecycle/project receipt. It carries no member state, user-state recovery or owner-state authority.\n'''
          if '## Final-admission persistence' in docs:
              raise SystemExit('release receipt T2 docs already present unexpectedly')
          docs_path.write_text(docs.rstrip() + '\n' + addition, encoding='utf-8')
          PY
      - name: Install Distribution
        run: python -m pip install .
      - name: Run focused T2 and affected promotion tests
        run: |
          python -m unittest -v \
            tests.test_release_receipt \
            tests.test_release_receipt_admission \
            tests.test_core_promotion \
            tests.test_promotion_qualification_regressions
      - name: Commit bounded T2 implementation
        shell: bash
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add src/aiverse_distribution/core_promotion.py tests/test_core_promotion.py tests/test_release_receipt_admission.py docs/RELEASE-RECEIPT.md
          git diff --cached --check
          git commit -m "Wire durable release receipts into Core final admission"
          git push origin HEAD:slice-5.4-t2-release-receipt-admission
