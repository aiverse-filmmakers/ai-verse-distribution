name: Slice 5.4 T2 implementation

on:
  push:
    branches:
      - slice-5.4-t2-release-receipt-admission

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded T2 implementation
        run: python .github/scripts/slice_54_t2_patch.py
      - name: Install Distribution
        run: python -m pip install .
      - name: Run focused T2 and affected promotion tests
        shell: bash
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/tests:${PYTHONPATH}"
          python -m unittest -v test_release_receipt test_release_receipt_admission test_core_promotion test_promotion_qualification_regressions
      - name: Commit bounded T2 implementation
        shell: bash
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add src/aiverse_distribution/core_promotion.py tests/test_core_promotion.py tests/test_release_receipt_admission.py docs/RELEASE-RECEIPT.md
          git diff --cached --check
          git commit -m "Wire durable release receipts into Core final admission"
          git push origin HEAD:slice-5.4-t2-release-receipt-admission
