name: Apply Slice 4.2 runtime-release fix

on:
  push:
    branches: [safe-infra-4.2-update-gating]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe-infra-4.2-update-gating
          fetch-depth: 0
      - name: Apply guarded fix
        run: python tools/fix_slice_4_2_runtime_release.py
      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/aiverse_distribution/infrastructure_gate.py tests/test_infrastructure_update_gate.py
          git commit -m "Scope structural descriptor probes to catalog releases"
          git push origin HEAD:safe-infra-4.2-update-gating
