name: Composed Goal Learning Acceptance

on:
  pull_request:
    paths:
      - "tests/acceptance/composed_goal_learning_acceptance.py"
      - "tests/acceptance/agent_acceptance.py"
      - "release-sets/agent-video-editor-rc1-2026-10-04.json"
      - ".github/workflows/composed-goal-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Distribution
        run: python -m pip install .
      - name: Prove Goal bound learning and later Skill reuse
        env:
          AI_VERSE_ACCEPTANCE_RELEASE_SET: agent-video-editor-rc1-2026-10-04
          AI_VERSE_ACCEPTANCE_EXPECTED_REFS: '{"ai-verse-os":"924a21a3dc1094d0fb6cc422f55fdfc714634e4d","ai-verse-brain":"6f986e8d06c7f9c069fbf05aa92ae7b7a1af9bf4","ai-verse-memory":"406b14fb4398eb1b16dd5f30e50520e8c3540972","ai-verse-skills":"afde5c06307fba7d074de2929c2eb6c3dc6bdab8","ai-verse-data":"8edde7dca5afa34e300130cc6b8ee2b4170ad40f","ai-verse-gateway":"46c15ee58b028dd7fb8b310327ea705ef618805e","ai-verse-automations":"caaed83b98026dd955640fc015d181529b91a1c6","ai-verse-multiple-bots":"c600e2bc014351a61e1c0e2673fc63f5d5fa54ec","ai-verse-token":"23b7b8ecbc9d9ef267f5e10449f785eb11107dd4"}'
        run: python tests/acceptance/composed_goal_learning_acceptance.py
