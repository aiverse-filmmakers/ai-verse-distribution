name: Propagation Slice 5.2 T2 Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/propagation-52-t2-publish.yml

permissions:
  contents: write

jobs:
  publish-t2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact validated T2 patch
        run: python scripts/propagation_52_t2_apply_temp.py
      - name: Compile changed Python
        run: python -m py_compile src/aiverse_distribution/core_update.py src/aiverse_distribution/generated_refresh.py src/aiverse_distribution/project_install.py tests/test_lifecycle_payload_wiring.py
      - name: Install Distribution
        run: python -m pip install .
      - name: Run focused T2 wiring tests
        run: python -m unittest tests.test_lifecycle_payload_wiring tests.test_project_install tests.test_generated_refresh -v
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify exact T2 product files
        shell: python
        run: |
          import subprocess

          expected = {
              "docs/MEMBER-PAYLOAD-GUARD.md",
              "src/aiverse_distribution/core_update.py",
              "src/aiverse_distribution/generated_refresh.py",
              "src/aiverse_distribution/project_install.py",
              "tests/test_lifecycle_payload_wiring.py",
          }
          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          actual = set()
          for line in raw.splitlines():
              if not line.strip():
                  continue
              actual.add(line[3:])
          if actual != expected:
              raise SystemExit(
                  "unexpected T2 worktree files: "
                  + repr(sorted(actual))
                  + " expected="
                  + repr(sorted(expected))
              )
      - name: Commit Slice 5.2 T2 wiring
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add docs/MEMBER-PAYLOAD-GUARD.md \
            src/aiverse_distribution/core_update.py \
            src/aiverse_distribution/generated_refresh.py \
            src/aiverse_distribution/project_install.py \
            tests/test_lifecycle_payload_wiring.py
          git commit -m "Wire lifecycle member payload guard"
          git push origin HEAD:main
