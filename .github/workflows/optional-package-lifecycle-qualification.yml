name: Optional Codex Package Native Lifecycle Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - name: Preserve exact source bytes on Windows checkouts
        run: git config --global core.autocrlf false

      - name: Check out the exact accepted OS package source
        uses: actions/checkout@v4
        with:
          repository: aiverse-filmmakers/AI-Verse-OS
          ref: 1f90aa75401dd27e89f7cf466bed14db311a4db1
          path: .qualification/ai-verse-os

      - name: Install Distribution from this change
        run: python -m pip install .

      - name: Qualify exact package install, setup, doctor, and removal
        run: python tests/acceptance/optional_package_lifecycle.py .qualification/ai-verse-os
