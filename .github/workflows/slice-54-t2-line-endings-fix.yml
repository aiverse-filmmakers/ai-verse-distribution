name: Slice 5.4 T2 cross-platform byte fix

on:
  push:
    branches:
      - slice-5.4-t2-release-receipt-admission

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic byte fix
        run: python .github/scripts/slice_54_t2_line_endings_fix.py
      - name: Install Distribution
        run: python -m pip install .
      - name: Run durable receipt admission tests
        shell: bash
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/tests:${PYTHONPATH}"
          python -m unittest -v test_release_receipt_admission test_release_receipt test_core_promotion
      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add src/aiverse_distribution/core_promotion.py
          git diff --cached --check
          git commit -m "Persist Core promotion evidence with canonical bytes"
          git push origin HEAD:slice-5.4-t2-release-receipt-admission
