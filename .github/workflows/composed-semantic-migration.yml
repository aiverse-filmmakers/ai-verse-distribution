name: Composed Semantic Migration Acceptance

on:
  pull_request:
    paths:
      - "tests/acceptance/composed_migration_acceptance.py"
      - "release-sets/agent-video-editor-rc1-2026-10-04.json"
      - "src/aiverse_distribution/catalog/**"
      - "src/aiverse_distribution/**"
      - ".github/workflows/composed-semantic-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Distribution
        run: python -m pip install .
      - name: Run composed semantic migration through real owners
        run: python tests/acceptance/composed_migration_acceptance.py
