[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-verse-distribution"
version = "0.1.0b1"
description = "Canonical one-product installer and compatible release-set orchestrator for AI-Verse"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
aiverse = "aiverse_distribution.entrypoint:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiverse_distribution = ["catalog/*.json", "dependency_locks/*/*/*.json"]

# The official Distribution main snapshot is resolved to an immutable commit
# before this handoff interface is used. This is not a second Core channel.
[tool.aiverse.distribution-update]
protocol = 1
entrypoint = "main"
